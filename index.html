<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e66d0">
<title>Uhr lernen</title>
<style>
:root{
  --blue:#1e66d0; --red:#d8322b; --ink:#1d2433; --muted:#6b7a99;
  --bg:#f3f6fc; --card:#fff; --line:#d9e0ef;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 12px 40px;max-width:480px;margin:0 auto}
button,select{font:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 2px}
header h1{font-size:20px;margin:0}
#stars{font-weight:700;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--card);
  border-radius:12px;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row select{flex:1;padding:9px;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.card{background:var(--card);border-radius:18px;padding:10px;margin:8px 0;
  box-shadow:0 1px 4px rgba(30,50,100,.10)}
#clock{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#clock.drag{touch-action:none;cursor:grab}
.grab{fill:transparent;stroke:none}
#tz{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;
  font-size:24px;font-weight:700;transition:background .3s}
#tz .em{font-size:36px;line-height:1}
#bar{position:relative;height:16px;border-radius:8px;overflow:hidden;margin:12px 4px 2px}
#bar i{position:absolute;top:0;bottom:0}
#marker{position:absolute;top:-2px;width:4px;height:20px;background:#000;border-radius:2px;
  transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
#barlbl{position:relative;height:16px;margin:0 4px;font-size:11px;color:var(--muted)}
#barlbl span{position:absolute;transform:translateX(-50%)}
#digital{display:flex;align-items:center;justify-content:center;gap:6px;background:#0f1a30;
  border-radius:16px;padding:8px 10px}
.walze{position:relative;width:96px;height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;padding:44px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.walze::-webkit-scrollbar{display:none}
.walze div{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;
  font:700 36px ui-monospace,Menlo,Consolas,monospace;color:#7fa6ff}
.wwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.wwin{position:relative}
.wwin::after{content:"";position:absolute;left:4px;right:4px;top:44px;height:44px;pointer-events:none;
  border-top:2px solid #5b8cff;border-bottom:2px solid #5b8cff;background:rgba(91,140,255,.15);border-radius:6px}
.wbtn{width:96px;border:0;background:#1b2a4a;color:#9db8ff;font-size:16px;padding:6px;border-radius:8px}
.wbtn:active{background:#2b4075}
.colon{font:700 36px ui-monospace,monospace;color:#7fa6ff}
.lbl{color:#8fa3cf;font-size:12px;margin-bottom:2px}
#words{text-align:center;font-size:20px;font-weight:600;margin:8px 0 2px;min-height:26px}
#words small{font-size:16px;font-weight:500;color:var(--muted)}
#task{font-size:20px;font-weight:700;text-align:center;margin:4px 0}
#target{font:700 44px ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--blue)}
#msg{text-align:center;font-size:18px;font-weight:600;min-height:26px;margin:6px 0}
#msg.ok{color:#1b8a3a}#msg.bad{color:var(--red)}
.big{width:100%;padding:14px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-size:19px;font-weight:700;margin-top:4px}
.big.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.small{padding:10px 12px;border:2px solid var(--line);background:var(--card);border-radius:10px;
  font-weight:600;color:var(--ink)}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:8px 2px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:20px;height:20px}
#lock{position:relative;overflow:hidden}
#lockfill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(30,102,208,.25)}
[hidden]{display:none!important}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .5s}
</style>
</head>
<body>
<header><h1>🕐 Uhr lernen</h1><div id="stars">⭐ 0</div></header>

<div class="tabs" id="tabs">
  <button data-mode="frei" class="on">Frei</button>
  <button data-mode="lesen">Uhr lesen</button>
  <button data-mode="stellen">Uhr stellen</button>
</div>
<div class="row" id="levelRow" hidden>
  <select id="level">
    <option value="1">Stufe 1: volle Stunde</option>
    <option value="2">Stufe 2: halbe Stunde</option>
    <option value="3">Stufe 3: Viertelstunde</option>
    <option value="4">Stufe 4: 5-Minuten-Schritte</option>
    <option value="5">Stufe 5: jede Minute</option>
    <option value="6">Stufe 6: 0–24 Uhr</option>
  </select>
</div>

<div class="card">
  <div id="task" hidden></div>
  <div id="target" hidden></div>
  <svg id="clock" viewBox="0 0 400 400" aria-label="Analoguhr"></svg>
  <div id="tz"></div>
  <div id="bar"><div id="marker"></div></div>
  <div id="barlbl"></div>
</div>

<div class="card" id="digitalCard">
  <div id="digital">
    <div class="wwrap"><span class="lbl">Stunde</span>
      <button class="wbtn" id="hUp">▲</button>
      <div class="wwin"><div class="walze" id="wh"></div></div>
      <button class="wbtn" id="hDn">▼</button></div>
    <span class="colon">:</span>
    <div class="wwrap"><span class="lbl">Minute</span>
      <button class="wbtn" id="mUp">▲</button>
      <div class="wwin"><div class="walze" id="wm"></div></div>
      <button class="wbtn" id="mDn">▼</button></div>
  </div>
</div>

<div id="words"></div>
<div id="msg"></div>
<button class="big" id="check" hidden>Prüfen</button>
<button class="big alt" id="half" hidden>☀️ 0–12 Uhr / 🌙 12–24 Uhr umschalten</button>
<div class="row" id="freiRow">
  <button class="small" id="now">Jetzt</button>
  <button class="small" id="hide" style="flex:1">👁 Walzen ausblenden (Kind sieht nur die Uhr)</button>
  <button class="small" id="lock" style="flex:1" hidden><span id="lockfill"></span>🔒 Zum Einblenden 1,5 s halten</button>
</div>
<div class="opts">
  <label><input type="checkbox" id="optTz" checked> Tageszeit anzeigen</label>
  <label><input type="checkbox" id="optWords"> Zeit in Worten</label>
</div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg", C = 200, IH = 44;
const S = {
  h: 10, m: 10, mode: "frei", level: 1, walzenVisible: true,
  showTz: true, showWords: false, stars: 0,
  task: null, ans: {h: 12, m: 0}, tries: 0, done: false
};
try { S.stars = +localStorage.getItem("uhr-stars") || 0; } catch (e) {}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const mod = (a, n) => ((a % n) + n) % n;

/* ---------- Tageszeiten ---------- */
const TZ = [
  {name: "Mitternacht", em: "🌙", from: 1425, to: 15,   c: "#16204a", t: "#fff", face: "#e4e8f7"},
  {name: "Nacht",       em: "🌙", from: 15,   to: 360,  c: "#26346b", t: "#fff", face: "#e4e8f7"},
  {name: "Morgen",      em: "🌅", from: 360,  to: 540,  c: "#ffb36b", t: "#3a2200", face: "#fff0df"},
  {name: "Vormittag",   em: "🌤️", from: 540,  to: 720,  c: "#ffe58a", t: "#3a3000", face: "#fffbe3"},
  {name: "Mittag",      em: "☀️", from: 720,  to: 840,  c: "#ffd23f", t: "#3a3000", face: "#fff8cf"},
  {name: "Nachmittag",  em: "🌞", from: 840,  to: 1080, c: "#ffc27a", t: "#3a2200", face: "#fff1dc"},
  {name: "Abend",       em: "🌇", from: 1080, to: 1320, c: "#9a6bd1", t: "#fff", face: "#efe6fa"},
  {name: "Nacht",       em: "🌙", from: 1320, to: 1425, c: "#26346b", t: "#fff", face: "#e4e8f7"}
];
function tzOf(h, m) {
  const t = h * 60 + m;
  return TZ.find(z => z.from < z.to ? (t >= z.from && t < z.to) : (t >= z.from || t < z.to));
}

/* ---------- Zeit in Worten ---------- */
const HN = ["zwölf","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf"];
const NUM = ["","eine","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf",
  "dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn","zwanzig","einundzwanzig",
  "zweiundzwanzig","dreiundzwanzig","vierundzwanzig","fünfundzwanzig","sechsundzwanzig",
  "siebenundzwanzig","achtundzwanzig","neunundzwanzig"];
function words(h, m) {
  const a = mod(h, 12), n = mod(h + 1, 12);
  const H = HN[a], N = HN[n];
  let s;
  switch (m) {
    case 0:  s = (a === 1 ? "ein" : H) + " Uhr"; break;
    case 5:  s = "fünf nach " + H; break;
    case 10: s = "zehn nach " + H; break;
    case 15: s = "Viertel nach " + H; break;
    case 20: s = "zwanzig nach " + H; break;
    case 25: s = "fünf vor halb " + N; break;
    case 30: s = "halb " + N; break;
    case 35: s = "fünf nach halb " + N; break;
    case 40: s = "zwanzig vor " + N; break;
    case 45: s = "Viertel vor " + N; break;
    case 50: s = "zehn vor " + N; break;
    case 55: s = "fünf vor " + N; break;
    default:
      s = m < 30 ? `${NUM[m]} ${m === 1 ? "Minute" : "Minuten"} nach ${H}`
                 : `${NUM[60 - m]} ${60 - m === 1 ? "Minute" : "Minuten"} vor ${N}`;
  }
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* 24-Stunden-Lesart: "Sechzehn Uhr fünfzehn" */
const ONES = ["","ein","zwei","drei","vier","fünf","sechs","sieben","acht","neun"];
const TEENS = ["zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const TENS = ["","","zwanzig","dreißig","vierzig","fünfzig"];
function numWord(n) {
  if (n === 0) return "null";
  if (n < 10) return ONES[n];
  if (n < 20) return TEENS[n - 10];
  const o = n % 10, t = TENS[Math.floor(n / 10)];
  return o ? ONES[o] + "und" + t : t;
}
function words24(h, m) {
  const s = numWord(h) + " Uhr" + (m ? " " + (m === 1 ? "eins" : numWord(m)) : "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function wordsHtml(h, m) {
  const a = words24(h, m), b = words(h, m);
  return a === b ? a : `${a}<br><small>„${b}“</small>`;
}

/* ---------- Zifferblatt ---------- */
const svg = $("clock");
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function pt(r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [C + r * Math.cos(a), C + r * Math.sin(a)];
}
function label(txt, r, deg, size, fill, weight) {
  const [x, y] = pt(r, deg);
  const t = mk("text", {x, y, "text-anchor": "middle", "dominant-baseline": "central",
    "font-size": size, "font-weight": weight, fill, "font-family": "system-ui,sans-serif"});
  t.textContent = txt;
}
const face = mk("circle", {cx: C, cy: C, r: 198, fill: "#fff", stroke: "#1d2433", "stroke-width": 3});
for (let i = 0; i < 60; i++) {
  const five = i % 5 === 0, [x1, y1] = pt(five ? 177 : 185, i * 6), [x2, y2] = pt(194, i * 6);
  mk("line", {x1, y1, x2, y2, stroke: five ? "#d8322b" : "#8a94ad", "stroke-width": five ? 3 : 1.5});
}
for (let n = 5; n <= 60; n += 5) label(n, 165, n * 6, 13, "#d8322b", 600);
for (let n = 1; n <= 12; n++) label(n, 134, n * 30, 30, "#1e66d0", 700);
for (let n = 13; n <= 24; n++) label(n, 100, (n - 12) * 30, 15, "#6b7a99", 600);

const gH = mk("g", {}), gM = mk("g", {});
mk("line", {x1: C, y1: C + 14, x2: C, y2: C - 80, stroke: "#1e66d0", "stroke-width": 13, "stroke-linecap": "round"}, gH);
const hGrab = mk("circle", {cx: C, cy: C - 80, r: 17, class: "grab", stroke: "#1e66d0"}, gH);
mk("line", {x1: C, y1: C + 20, x2: C, y2: C - 150, stroke: "#d8322b", "stroke-width": 7, "stroke-linecap": "round"}, gM);
const mGrab = mk("circle", {cx: C, cy: C - 150, r: 17, class: "grab", stroke: "#d8322b"}, gM);
mk("circle", {cx: C, cy: C, r: 9, fill: "#1d2433"});

/* ---------- Tageszeit-Leiste ---------- */
(function buildBar() {
  const bar = $("bar");
  const seg = (a, b, c) => {
    const i = document.createElement("i");
    i.style.left = a / 14.4 + "%"; i.style.width = (b - a) / 14.4 + "%"; i.style.background = c;
    bar.insertBefore(i, $("marker"));
  };
  seg(0, 15, TZ[0].c);
  [1, 2, 3, 4, 5, 6].forEach(k => seg(TZ[k].from, TZ[k].to, TZ[k].c));
  seg(1320, 1425, TZ[7].c); seg(1425, 1440, TZ[0].c);
  const lbl = $("barlbl");
  [0, 6, 12, 18, 24].forEach(h => {
    const s = document.createElement("span");
    s.style.left = h / 24 * 100 + "%"; s.textContent = h;
    lbl.appendChild(s);
  });
})();

/* ---------- Walzen ---------- */
function makeWalze(el, count, onChange) {
  for (let i = 0; i < count; i++) {
    const d = document.createElement("div"); d.textContent = pad(i); el.appendChild(d);
  }
  const w = {el, cur: -1};
  el.addEventListener("scroll", () => {
    const i = Math.max(0, Math.min(count - 1, Math.round(el.scrollTop / IH)));
    if (i !== w.cur) { w.cur = i; onChange(i); }
  });
  w.set = i => { w.cur = i; el.scrollTop = i * IH; };
  return w;
}
const wH = makeWalze($("wh"), 24, i => walzeChanged("h", i));
const wM = makeWalze($("wm"), 60, i => walzeChanged("m", i));
function walzeChanged(kind, v) {
  if (S.mode === "lesen") { S.ans[kind] = v; }
  else if (S.mode === "frei") { S[kind] = v; }
  renderClock();
}
function setWalzen(h, m) { wH.set(h); wM.set(m); }
function walzeTime() { return S.mode === "lesen" ? S.ans : S; }
function nudge(dh, dm) {
  const t = walzeTime();
  let total = t.h * 60 + t.m + dh * 60 + dm;
  total = mod(total, 1440);
  t.h = Math.floor(total / 60); t.m = total % 60;
  setWalzen(t.h, t.m);
  renderClock();
}
$("hUp").onclick = () => nudge(1, 0);  $("hDn").onclick = () => nudge(-1, 0);
$("mUp").onclick = () => nudge(0, 1);  $("mDn").onclick = () => nudge(0, -1);

/* ---------- Rendern ---------- */
function renderClock() {
  gH.setAttribute("transform", `rotate(${mod(S.h, 12) * 30 + S.m * 0.5} ${C} ${C})`);
  gM.setAttribute("transform", `rotate(${S.m * 6} ${C} ${C})`);
  const z = tzOf(S.h, S.m);
  face.setAttribute("fill", z.face);
  const forceTz = S.mode !== "frei" && S.level === 6;
  const tzOn = S.showTz || forceTz;
  $("tz").hidden = !tzOn; $("bar").hidden = !tzOn; $("barlbl").hidden = !tzOn;
  $("tz").style.background = z.c; $("tz").style.color = z.t;
  $("tz").innerHTML = `<span class="em">${z.em}</span><span>${z.name}</span>`;
  $("marker").style.left = (S.h * 60 + S.m) / 14.4 + "%";
  const drag = canDrag();
  svg.classList.toggle("drag", drag);
  hGrab.style.display = mGrab.style.display = drag ? "" : "none";
  renderWords();
}
function renderWords() {
  let txt = "";
  if (S.showWords) {
    if (S.mode === "frei" && S.walzenVisible) txt = wordsHtml(S.h, S.m);
    else if (S.mode !== "frei" && S.task) txt = "Tipp: " + wordsHtml(S.task.h, S.task.m);
  }
  $("words").innerHTML = txt;
}
function renderLayout() {
  const frei = S.mode === "frei";
  $("levelRow").hidden = frei;
  $("digitalCard").hidden = !((frei && S.walzenVisible) || S.mode === "lesen");
  $("freiRow").hidden = !frei;
  $("hide").hidden = !(frei && S.walzenVisible);
  $("lock").hidden = !(frei && !S.walzenVisible);
  $("now").hidden = !(frei && S.walzenVisible);
  $("check").hidden = frei;
  $("half").hidden = !(S.mode === "stellen" && S.level === 6);
  $("task").hidden = frei;
  $("target").hidden = S.mode !== "stellen";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  renderClock();
}
function renderStars() { $("stars").textContent = "⭐ " + S.stars; }
function canDrag() { return S.mode === "stellen" || (S.mode === "frei" && S.walzenVisible); }

/* ---------- Zeiger ziehen ---------- */
let dragging = null;
function svgPoint(ev) {
  const r = svg.getBoundingClientRect(), k = 400 / r.width;
  const dx = (ev.clientX - r.left) * k - C, dy = (ev.clientY - r.top) * k - C;
  return {ang: mod(Math.atan2(dx, -dy) * 180 / Math.PI, 360), dist: Math.hypot(dx, dy)};
}
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
svg.addEventListener("pointerdown", ev => {
  if (!canDrag()) return;
  const p = svgPoint(ev);
  const hA = mod(S.h, 12) * 30 + S.m * 0.5, mA = S.m * 6;
  dragging = (p.dist < 112 && angDiff(p.ang, hA) < angDiff(p.ang, mA)) ? "h" : "m";
  svg.setPointerCapture(ev.pointerId);
  moveHand(p);
});
svg.addEventListener("pointermove", ev => { if (dragging) moveHand(svgPoint(ev)); });
const endDrag = () => { dragging = null; };
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
function moveHand(p) {
  if (dragging === "m") {
    const nm = Math.round(p.ang / 6) % 60, old = S.m;
    if (old > 45 && nm < 15) S.h = mod(S.h + 1, 24);
    else if (old < 15 && nm > 45) S.h = mod(S.h - 1, 24);
    S.m = nm;
  } else {
    const h12 = Math.round(mod(p.ang - S.m * 0.5, 360) / 30) % 12;
    S.h = h12 + (S.h >= 12 ? 12 : 0);
  }
  if (S.mode === "frei") setWalzen(S.h, S.m);
  renderClock();
}

/* ---------- Aufgaben ---------- */
const rnd = n => Math.floor(Math.random() * n);
function genTime(level) {
  let h = rnd(24), m;
  if (level === 6) h = rnd(2) ? 13 + rnd(11) % 11 : rnd(24);
  h = mod(h, 24);
  const mins = {1: [0], 2: [0, 30], 3: [0, 15, 30, 45]}[level];
  if (mins) m = mins[rnd(mins.length)];
  else if (level === 5) m = rnd(60);
  else m = rnd(12) * 5;
  return {h, m};
}
function newTask() {
  let t, tries = 0;
  do { t = genTime(S.level); tries++; }
  while (S.task && t.h === S.task.h && t.m === S.task.m && tries < 20);
  S.task = t; S.tries = 0; S.done = false;
  $("msg").textContent = ""; $("msg").className = "";
  $("check").textContent = "Prüfen";
  if (S.mode === "lesen") {
    S.h = t.h; S.m = t.m; S.ans = {h: 12, m: 0};
    setWalzen(12, 0);
    $("task").textContent = S.level === 6
      ? "Wie spät ist es? Achte auf die Tageszeit!" : "Wie spät ist es? Stelle die Walzen ein.";
  } else {
    let s;
    do { s = genTime(S.level); } while (s.h === t.h && s.m === t.m);
    S.h = s.h; S.m = s.m;
    $("task").textContent = S.level === 6
      ? `Stelle die Uhr (${tzOf(t.h, t.m).name}):` : "Stelle die Uhr auf:";
    $("target").textContent = `${pad(t.h)}:${pad(t.m)} Uhr`;
  }
  renderLayout();
}
function check() {
  if (S.done) { newTask(); return; }
  const t = S.task, a = S.mode === "lesen" ? S.ans : S;
  const hOk = S.level === 6 ? a.h === t.h : mod(a.h, 12) === mod(t.h, 12);
  const mOk = a.m === t.m;
  const msg = $("msg");
  if (hOk && mOk) {
    S.stars++; saveStars(); renderStars();
    $("stars").classList.remove("pop"); void $("stars").offsetWidth; $("stars").classList.add("pop");
    msg.textContent = "⭐ Super! Richtig!"; msg.className = "ok";
    S.done = true; $("check").textContent = "Weiter";
    return;
  }
  S.tries++;
  if (S.tries >= 3) {
    msg.textContent = `Richtig wäre ${pad(t.h)}:${pad(t.m)} Uhr. Schau noch einmal hin!`;
    msg.className = "bad"; S.done = true; $("check").textContent = "Weiter";
    if (S.mode === "stellen") { S.h = t.h; S.m = t.m; renderClock(); }
    return;
  }
  msg.className = "bad";
  if (!hOk && !mOk) msg.textContent = "Noch nicht. Kurzer blauer Zeiger = Stunde, langer roter = Minuten.";
  else if (!hOk) msg.textContent = S.level === 6 && mod(a.h, 12) === mod(t.h, 12)
    ? "Fast! Stunde stimmt, aber Vormittag oder Nachmittag?" : "Die Stunde stimmt noch nicht. Schau auf den kurzen blauen Zeiger.";
  else msg.textContent = "Die Minuten stimmen noch nicht. Schau auf den langen roten Zeiger.";
}
function saveStars() { try { localStorage.setItem("uhr-stars", S.stars); } catch (e) {} }
$("check").onclick = check;
$("half").onclick = () => { S.h = mod(S.h + 12, 24); renderClock(); };

/* ---------- Bedienung ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode;
  if (S.mode === "frei") { S.walzenVisible = true; setWalzen(S.h, S.m); renderLayout(); }
  else newTask();
});
$("level").onchange = e => { S.level = +e.target.value; newTask(); };
$("optTz").onchange = e => { S.showTz = e.target.checked; renderClock(); };
$("optWords").onchange = e => { S.showWords = e.target.checked; renderClock(); };
$("now").onclick = () => { const d = new Date(); S.h = d.getHours(); S.m = d.getMinutes(); setWalzen(S.h, S.m); renderClock(); };
$("hide").onclick = () => { S.walzenVisible = false; renderLayout(); };

let lockT = null;
function lockStart(ev) {
  ev.preventDefault();
  const f = $("lockfill"); f.style.transition = "width 1.5s linear"; f.style.width = "100%";
  lockT = setTimeout(() => { S.walzenVisible = true; lockStop(); renderLayout(); setWalzen(S.h, S.m); }, 1500);
}
function lockStop() {
  clearTimeout(lockT);
  const f = $("lockfill"); f.style.transition = "none"; f.style.width = "0";
}
const lk = $("lock");
lk.addEventListener("pointerdown", lockStart);
["pointerup", "pointerleave", "pointercancel"].forEach(e => lk.addEventListener(e, lockStop));
lk.addEventListener("contextmenu", e => e.preventDefault());

renderStars();
renderLayout();
requestAnimationFrame(() => setWalzen(S.h, S.m));
</script>
</body>
